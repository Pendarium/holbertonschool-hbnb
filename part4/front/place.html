<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Details</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="images/icon.png">
</head>
<body>
    <header>
        <a href="index.html">
            <img src="images/logo.png" class="logo" alt="Logo">
        </a>
        <nav>
            <a href="index.html" class="Acceuil-button">Accueil</a>
            <a href="login.html" class="login-button">Login</a>
        </nav>
    </header>

    <main>
        <!-- ID ajouté ici -->
        <section id="place-details" class="place-details">
            <!-- Les détails seront générés dynamiquement par script.js -->
        </section>

        <section id="reviews">
            <!-- Les reviews seront générées dynamiquement par script.js -->
        </section>

        <section id="add-review">
            <form id="review-form">
                <h2>Add a Review</h2>
                <label for="review-text">Review:</label>
                <textarea id="review-text" name="review-text" required></textarea>

                <label for="rating">Rating:</label>
                <select id="rating" name="rating" required>
                    <option value="" disabled selected>Select rating</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>

                <button type="submit">Submit Review</button>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
    <footer>
        <p>All rights reserved.</p>
    </footer>
</body>
</html>
