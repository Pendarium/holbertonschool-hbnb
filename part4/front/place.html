<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Details</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="images/icon.png">
</head>

<body>

    <header>
        <a href="index.html">
            <img src="/part 4/front/images/logo.png" class="logo" alt="Logo">
        </a>
        <nav>
            <a href="index.html" class="Acceuil-button">Acceuil</a>
            <a href="login.html" class="Acceuil-button">Login</a>
        </nav>
    </header>

    <main>

        <section class="place-details">
            <!-- Exemple de contenu pour tester -->
            <h1>Beautiful Beach House</h1>
            <p class="place-info">Host: John Doe</p>
            <p class="place-info">Price: $150 / night</p>
            <p class="place-info">Description: A cozy house by the sea...</p>
        </section>

        <section id="reviews">
            <div class="review-card">
                <p>User: Alice</p>
                <p>Rating: ★★★★☆</p>
                <p>Comment: Great place to stay!</p>
            </div>
        </section>

        <section id="add-review">
            <h2>Add a Review</h2>
            <form id="review-form">
                <label for="review-text">Review:</label>
                <textarea id="review-text" name="review-text" required></textarea>
                <button type="submit">Submit</button>
            </form>
        </section>

    </main>

    <footer>
        <p>All rights reserved.</p>
    </footer>

</body>
</html>
